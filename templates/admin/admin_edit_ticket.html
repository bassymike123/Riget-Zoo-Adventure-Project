{% extends "admin/base.html" %}
{% block content %}
<h2>Edit Ticket</h2>
<link rel="stylesheet" href="/static/admin_dashboard.css">
<script src="/static/admin_dashboard.js"></script>
<form method="POST">
    <label>Name</label>
    <input type="text" name="name" value="{{ ticket.name }}" required>

    <label>Price (£)</label>
    <input type="number" step="0.01" name="price" value="{{ ticket.price }}" required>

    <label>Total Available</label>
    <input type="number" name="total_available" value="{{ ticket.total_available }}" required>

    <label>
        <input type="checkbox" name="active" {% if ticket.active %}checked{% endif %}>
        Active
    </label>
    
    <button type="submit">Save Changes</button>
</form>
{% endblock %}
