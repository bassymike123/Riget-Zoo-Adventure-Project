{% extends "admin/base.html" %}
{% block content %}
<h2>Edit Hotel Rooms</h2>
<link rel="stylesheet" href="/static/admin_dashboard.css">
<script src="/static/admin_dashboard.js"></script>

<form method="POST" class="form-grid">
    <input name="name" value="{{ room.name }}" placeholder="Room Name" required>
    <input name="price" type="number" step="0.01" value="{{ room.price_per_night }}" placeholder="Price (£)" required>
    <input name="total_rooms" type="number" value="{{ room.total_rooms }}" placeholder="Total Rooms" required>
    <input name="description" value="{{ room.description }}">

    <button class="btn" type="submit">Save Changes</button>
</form>
{% endblock %}
